# Локальный S3-совместимый бэкенд для состояния Terraform (MinIO).
#
# Запуск:  docker compose -f bootstrap/docker-compose.minio.yml up -d
# Консоль: http://localhost:9001 (minioadmin/minioadmin — задайте свои через переменные окружения)
# API:     http://localhost:9000 (для terraform: export AWS_ENDPOINT_URL_S3=http://localhost:9000)
#
# Сервис createbuckets разово создаёт бакет состояния future20-tfstate-b1g*********
# (единый бакет; окружения разнесены префиксами envs/dev/, envs/stage/, envs/prod/ —
# см. backend "s3" workspace_key_prefix envs) и включает версионирование
# (защита от случайной перезаписи/удаления состояния).

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/future20-tfstate-b1g*********;
      mc version enable local/future20-tfstate-b1g*********;
      echo 'buckets ready';
      exit 0;
      "

volumes:
  minio-data:
